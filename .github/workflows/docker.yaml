# CI for Loupe. Two stages:
#   1. test  — gofmt + vet + race-tested Go suite. Runs on every push, PR and
#              dispatch. (The full lint/audit/coverage gate is check.yml.)
#   2. build — builds the production image to validate the Dockerfile, frontend
#              build and Go compile. Pushes to GitHub Container Registry (ghcr.io)
#              ONLY on the default branch (main) or a release tag (v*); PRs and
#              other branches build for validation but never publish. Published
#              images are signed by digest with cosign (keyless, Sigstore).
#
# Publishing needs no configured secrets — the workflow authenticates to ghcr.io
# with the built-in GITHUB_TOKEN via the `packages: write` permission, and the
# signature uses the job's OIDC identity (`id-token: write`).
#
# Actions are pinned to commit SHAs (the trailing comment is the tag); Renovate
# keeps the pins current.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build; superseded PR/branch builds are fair game.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Full test pass — gates the build job via `needs`. Runs for every trigger,
  # so pull requests are properly checked before anything is built or pushed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # zizmor: ignore[cache-poisoning] -- this cache never reaches the image; the build job compiles inside Docker
          cache: true # cache the module + build cache (pgx/mysql/sqlite deps)

      # Fail fast on unformatted code — `gofmt -l` lists offending files, so a
      # non-empty result means the tree isn't `gofmt`-clean.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Run the whole suite with the race detector. -shuffle=on surfaces hidden
      # inter-test ordering dependencies; -count=1 disables the test result cache
      # so every push actually executes the tests; coverage is written for the
      # whole module. (Race needs a C toolchain on the runner.)
      - name: go test (race detector)
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the built-in GITHUB_TOKEN
      id-token: write  # keyless cosign signature of the pushed image
    env:
      # Publish only from the default branch or a release tag. Everything else
      # (PRs, feature branches, manual dispatch off main) builds but never pushes.
      PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Git metadata for the About page, injected into the binary via build args
      # (the Dockerfile has no .git context, so Go can't auto-stamp VCS info).
      # Mirrors the Makefile's LDFLAGS: short commit, exact tag (empty otherwise),
      # and a UTC build timestamp. The tag goes through an env var so the ref
      # name is never interpolated into the shell script.
      - name: Build metadata
        id: build_meta
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "tag=${RELEASE_TAG}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Always builds (validates Dockerfile + frontend + Go compile). `push` and
      # the registry cache export are gated on PUSH so non-release runs never
      # touch the registry. BuildKit attaches an SPDX SBOM and SLSA provenance
      # as attestations in the pushed image index (`docker buildx imagetools
      # inspect <image> --format '{{ json .SBOM }}'` reads them back).
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT=${{ steps.build_meta.outputs.commit }}
            GIT_TAG=${{ steps.build_meta.outputs.tag }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max' || '' }}

      # Sign the pushed image by digest (one signature covers every tag). Keyless:
      # the certificate is bound to this workflow's OIDC identity, and the
      # signature lands in the Sigstore transparency log. Verify with
      #   cosign verify ghcr.io/<owner>/loupe:<tag> \
      #     --certificate-identity-regexp='^https://github.com/<owner>/loupe/' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
